    <script>
        // 游戏变量
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const leaderboardEntries = document.getElementById('leaderboard-entries');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        
        let score = 0;
        let timeLeft = 60;
        let gameActive = false;
        let animationId;
        let fruitInterval;
        let gameTimer;
        let basket = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 50,
            width: 100,
            height: 30
        };
        
        let fruits = [];
        let leaderboard = JSON.parse(localStorage.getItem('fruitNinjaLeaderboard')) || [];
        
        // 水果类型
        const FRUIT_TYPES = [
            { name: 'apple', image: 'apple', score: 3, speed: 2, radius: 20 }, // 苹果 3分
            { name: 'banana', image: 'banana', score: 1, speed: 2, radius: 25 }, // 香蕉 1分
            { name: 'orange', image: 'orange', score: 5, speed: 2, radius: 22 }, // 橙子 5分
            { name: 'grape', image: 'grape', score: 5, speed: 2, radius: 18 }, // 葡萄 5分
            { name: 'watermelon', image: 'watermelon', score: 20, speed: 6, radius: 28 } // 西瓜 20分，速度3倍
        ];
        
        // 加载水果图片
        const fruitImages = {};
        FRUIT_TYPES.forEach(type => {
            const img = new Image();
            img.src = `https://i.imgur.com/${getImageCode(type.name)}.png`;
            fruitImages[type.image] = img;
        });
        
        function getImageCode(fruitName) {
            const codes = {
                apple: 'JQ9w0Wq',
                banana: '5X5w0Wq',
                orange: '8X5w0Wq',
                grape: '9X5w0Wq',
                watermelon: '7X5w0Wq'
            };
            return codes[fruitName] || 'JQ9w0Wq';
        }
        
        // 事件监听器
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);
        
        canvas.addEventListener('mousemove', moveBasket);
        
        // 移动篮子
        function moveBasket(e) {
            if (!gameActive) return;
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            
            basket.x = mouseX - basket.width / 2;
            
            // 限制篮子不超出画布
            if (basket.x < 0) {
                basket.x = 0;
            } else if (basket.x > canvas.width - basket.width) {
                basket.x = canvas.width - basket.width;
            }
        }
        
        // 开始游戏
        function startGame() {
            // 清理之前的游戏状态
            cancelAnimationFrame(animationId);
            clearInterval(fruitInterval);
            clearInterval(gameTimer);
            
            // 重置游戏状态
            score = 0;
            timeLeft = 60;
            fruits = [];
            gameActive = true;
            
            scoreDisplay.textContent = `分数: ${score}`;
            timeDisplay.textContent = `时间: ${timeLeft}`;
            
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            // 启动游戏循环
            gameLoop();
            
            // 启动计时器
            gameTimer = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = `时间: ${timeLeft}`;
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
            
            // 生成水果
            fruitInterval = setInterval(createFruit, 800);
        }
        
        // 创建水果
        function createFruit() {
            if (!gameActive) return;
            
            // 根据概率选择水果类型
            const rand = Math.random();
            let typeIndex;
            
            if (rand < 0.1) { // 10%概率西瓜
                typeIndex = 4;
            } else if (rand < 0.3) { // 20%概率香蕉
                typeIndex = 1;
            } else if (rand < 0.6) { // 30%概率苹果
                typeIndex = 0;
            } else if (rand < 0.8) { // 20%概率橙子
                typeIndex = 2;
            } else { // 20%概率葡萄
                typeIndex = 3;
            }
            
            const type = FRUIT_TYPES[typeIndex];
            
            const fruit = {
                x: Math.random() * (canvas.width - type.radius * 2) + type.radius,
                y: -type.radius * 2,
                type: type,
                radius: type.radius,
                speed: type.speed,
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.2
            };
            
            fruits.push(fruit);
        }
        
        // 游戏循环
        function gameLoop() {
            if (!gameActive) {
                cancelAnimationFrame(animationId);
                return;
            }
            
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景效果
            drawBackground();
            
            // 绘制篮子
            drawBasket();
            
            // 更新和绘制水果
            updateFruits();
            
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // 绘制背景效果
        function drawBackground() {
            // 渐变背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 添加一些星光效果
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 2;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 绘制篮子
        function drawBasket() {
            // 篮子底部阴影
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(basket.x + basket.width / 2, basket.y + basket.height + 5, 
                       basket.width / 2 + 10, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 篮子主体
            const basketGradient = ctx.createLinearGradient(0, basket.y, 0, basket.y + basket.height);
            basketGradient.addColorStop(0, '#4a2511');
            basketGradient.addColorStop(1, '#2d1609');
            ctx.fillStyle = basketGradient;
            ctx.fillRect(basket.x, basket.y, basket.width, basket.height);
            
            // 篮子纹理
            ctx.strokeStyle = '#5a3515';
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                const y = basket.y + i * (basket.height / 4);
                ctx.beginPath();
                ctx.moveTo(basket.x, y);
                ctx.lineTo(basket.x + basket.width, y);
                ctx.stroke();
            }
        }
        
        // 更新和绘制水果
        function updateFruits() {
            for (let i = fruits.length - 1; i >= 0; i--) {
                const fruit = fruits[i];
                
                // 更新水果位置和旋转
                fruit.y += fruit.speed;
                fruit.rotation += fruit.rotationSpeed;
                
                // 绘制水果
                drawFruit(fruit);
                
                // 检测是否接到水果
                if (checkFruitCaught(fruit)) {
                    score += fruit.type.score;
                    scoreDisplay.textContent = `分数: ${score}`;
                    
                    // 添加得分效果
                    createScoreEffect(fruit.x, fruit.y, fruit.type.score);
                    
                    fruits.splice(i, 1);
                    continue;
                }
                
                // 移除超出屏幕的水果
                if (fruit.y - fruit.radius > canvas.height) {
                    fruits.splice(i, 1);
                }
            }
        }
        
        // 绘制水果
        function drawFruit(fruit) {
            ctx.save();
            ctx.translate(fruit.x, fruit.y);
            ctx.rotate(fruit.rotation);
            
            // 水果阴影
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(0, fruit.radius / 2, fruit.radius, fruit.radius / 3, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 绘制水果图片或回退图形
            const img = fruitImages[fruit.type.image];
            if (img && img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, -fruit.radius, -fruit.radius, fruit.radius * 2, fruit.radius * 2);
            } else {
                // 使用彩色圆形作为回退
                ctx.beginPath();
                ctx.arc(0, 0, fruit.radius, 0, Math.PI * 2);
                ctx.fillStyle = getFruitColor(fruit.type.name);
                ctx.fill();
            }
            
            // 快速水果添加光晕效果
            if (fruit.type.speed > 4) {
                ctx.beginPath();
                ctx.arc(0, 0, fruit.radius + 5, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(0, 0, fruit.radius, 0, 0, fruit.radius + 5);
                gradient.addColorStop(0, 'rgba(0, 200, 255, 0.8)');
                gradient.addColorStop(1, 'rgba(0, 200, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        // 获取水果颜色（备用）
        function getFruitColor(type) {
            switch(type) {
                case 'apple': return '#FF5252';
                case 'banana': return '#FFEB3B';
                case 'orange': return '#FF9800';
                case 'grape': return '#9C27B0';
                case 'watermelon': return '#4CAF50';
                default: return '#FF5722';
            }
        }
        
        // 检查是否接到水果
        function checkFruitCaught(fruit) {
            return (
                fruit.y + fruit.radius >= basket.y &&
                fruit.x + fruit.radius >= basket.x &&
                fruit.x - fruit.radius <= basket.x + basket.width
            );
        }
        
        // 创建得分效果
        function createScoreEffect(x, y, score) {
            const effect = {
                x: x,
                y: y,
                text: `+${score}`,
                opacity: 1,
                yOffset: 0,
                duration: 60 // 约1秒
            };
            
            function animate() {
                ctx.save();
                ctx.font = 'bold 24px Arial';
                ctx.fillStyle = `rgba(255, 255, 255, ${effect.opacity})`;
                ctx.strokeStyle = `rgba(255, 138, 0, ${effect.opacity})`;
                ctx.lineWidth = 2;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // 文字阴影
                for (let i = 0; i < 3; i++) {
                    ctx.strokeText(effect.text, effect.x, effect.y + effect.yOffset - i * 2);
                }
                
                ctx.fillText(effect.text, effect.x, effect.y + effect.yOffset);
                ctx.restore();
                
                effect.opacity -= 0.016; // 约60帧消失
                effect.yOffset -= 1;
                effect.duration--;
                
                if (effect.duration > 0) {
                    requestAnimationFrame(animate);
                }
            }
            
            animate();
        }
        
        // 结束游戏
        function endGame() {
            gameActive = false;
            clearInterval(fruitInterval);
            clearInterval(gameTimer);
            cancelAnimationFrame(animationId);
            
            finalScoreDisplay.textContent = `你的分数: ${score}`;
            gameOverScreen.style.display = 'flex';
            
            // 更新排行榜
            updateLeaderboard(score);
        }
        
        // 更新排行榜
        function updateLeaderboard(newScore) {
            leaderboard.push(newScore);
            leaderboard.sort((a, b) => b - a);
            leaderboard = leaderboard.slice(0, 10); // 保留前10名
            
            localStorage.setItem('fruitNinjaLeaderboard', JSON.stringify(leaderboard));
            
            // 显示排行榜
            leaderboardEntries.innerHTML = '';
            leaderboard.forEach((score, index) => {
                const entry = document.createElement('div');
                entry.className = 'leaderboard-entry';
                entry.innerHTML = `<span>第 ${index + 1} 名</span><span>${score} 分</span>`;
                leaderboardEntries.appendChild(entry);
            });
        }
    </script>
